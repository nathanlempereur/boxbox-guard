### Ce fichier de configuration est a ######
### modifier uniquement avec les valeurs ###
### indiquée possible au risque de crée des#
### problèmes sur votre serveur ############
############################################

# --- Variables de systeme ---
CONF_DIR="/etc/boxbox-guard"
SKIP_FILE="${CONF_DIR}/containers-skip.conf"
CACHE_DIR="${CONF_DIR}/.cache-error.d"
SCAN_DIR="/usr/local/bin"
VERSION_FILE="${CONF_DIR}/version.info"
# Temps d'attente entre chaque scan complet (en secondes)
SCAN_INTERVAL=5

# Lieu contenant les logs de boxbox-guard
LOG_DIR="/var/log"
LOG_FILE="${LOG_DIR}/boxbox-guard.log"

#Format de la date pour les logs
DATE_FORMAT="+%d/%m/%y-%H:%M:%S"

# Les tests de compromissions (0=NON 1=OUI) Par défaut aucun test n'est fait
TEST_USER=0 # Test si un user reel (en shell /bin/bash) a été ajouté dans le conteneur
NB_USER_MAX=1 # Combien d'user réel on autorise maximum, si + -> action
TEST_ROOT_SSH=0 # Test si un fichier de config, clé ssh ou empreinte de conexion a été installer
NB_FICHIER_MAX=0 #Combien de fichier ou dossier max doivent être présent pour SSH (mettre 2 si utilisation de clé avec root)
TEST_PROGRAM=0 # Test si un exe (cheval de troie, virus, mineur de crypto) a été installer dans /tmp
TEST_AUTH_CLEAR=0 # Test si le fichier Auth.log a été vider pour effacer les traces (authoriser uniquement si votre conteneur utilise Auth.log avec rsyslog)

# Action en cas d'erreur détectée (hard: poweroff / simple: deconnexion du réseau interne)
ERROR_ACTION="hard"
